apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-python-deploy
  namespace: virtustech-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vuln-python-deploy
  template:
    metadata:
      labels:
        app: vuln-python-deploy
    spec:
      containers:
      - name: python
        image: python:2.7
        command: ["sleep", "3600"]
